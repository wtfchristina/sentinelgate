[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelgate"
version = "0.1.0"
description = "Pre-execution package firewall and agentic slopsquatting interceptor"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
]
requires-python = ">=3.11"

[project.scripts]
sentinelgate = "sentinelgate.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
